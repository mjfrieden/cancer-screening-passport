name: Deploy App Engine Production

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy production application
    runs-on: ubuntu-latest
    environment: production

    env:
      DEPLOY_ENVIRONMENT: production
      DEPLOY_SERVICE: app-engine
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      HIPAA_SYNTHETIC_TESTING_APPROVED: ${{ vars.HIPAA_SYNTHETIC_TESTING_APPROVED }}
      HIPAA_PRODUCTION_APPROVED: ${{ vars.HIPAA_PRODUCTION_APPROVED }}
      GOOGLE_CLOUD_BAA_EFFECTIVE_DATE: ${{ vars.GOOGLE_CLOUD_BAA_EFFECTIVE_DATE }}
      HIPAA_SECURITY_OFFICER: ${{ vars.HIPAA_SECURITY_OFFICER }}
      HIPAA_PRIVACY_OFFICER: ${{ vars.HIPAA_PRIVACY_OFFICER }}
      HIPAA_INCIDENT_COMMANDER: ${{ vars.HIPAA_INCIDENT_COMMANDER }}
      HIPAA_BACKUP_OPERATIONAL_OWNER: ${{ vars.HIPAA_BACKUP_OPERATIONAL_OWNER }}
      HIPAA_LEGAL_COUNSEL: ${{ vars.HIPAA_LEGAL_COUNSEL }}
      HIPAA_RISK_ANALYSIS_APPROVED_DATE: ${{ vars.HIPAA_RISK_ANALYSIS_APPROVED_DATE }}
      HIPAA_SECURITY_TRAINING_COMPLETED_DATE: ${{ vars.HIPAA_SECURITY_TRAINING_COMPLETED_DATE }}
      HIPAA_INCIDENT_TABLETOP_COMPLETED_DATE: ${{ vars.HIPAA_INCIDENT_TABLETOP_COMPLETED_DATE }}
      HIPAA_RETENTION_POLICY_APPROVED_DATE: ${{ vars.HIPAA_RETENTION_POLICY_APPROVED_DATE }}
      HIPAA_ACCESS_REVIEW_COMPLETED_DATE: ${{ vars.HIPAA_ACCESS_REVIEW_COMPLETED_DATE }}
      HIPAA_BACKUP_RESTORE_TEST_COMPLETED_DATE: ${{ vars.HIPAA_BACKUP_RESTORE_TEST_COMPLETED_DATE }}
      HIPAA_FINAL_LEGAL_REVIEW_APPROVED_DATE: ${{ vars.HIPAA_FINAL_LEGAL_REVIEW_APPROVED_DATE }}
      HIPAA_BAA_RETAINED: ${{ vars.HIPAA_BAA_RETAINED }}
      HIPAA_SECOND_ACCOUNT_ISOLATION_VERIFIED: ${{ vars.HIPAA_SECOND_ACCOUNT_ISOLATION_VERIFIED }}
      PRODUCTION_AUTH_VERIFIED: ${{ vars.PRODUCTION_AUTH_VERIFIED }}
      VITE_ENABLE_CLINICAL_SIMULATOR: ${{ vars.VITE_ENABLE_CLINICAL_SIMULATOR || 'false' }}
      VITE_REAL_PHI_ENABLED: ${{ vars.VITE_REAL_PHI_ENABLED || 'false' }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_FIREBASE_FIRESTORE_DATABASE_ID: ${{ vars.VITE_FIREBASE_FIRESTORE_DATABASE_ID }}
      SMOKE_AUTH_STATE_B64: ${{ secrets.SMOKE_AUTH_STATE_B64 }}
      SMOKE_EXPECTED_EMAIL: ${{ vars.SMOKE_EXPECTED_EMAIL }}
      SMOKE_DELETE_ACCOUNT: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production deployment
        run: |
          npm run validate:env
          npm run validate:rules-deploy-env
          npm run validate:hipaa-production
          npm run preflight:beta

      - name: Build application
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_APP_ENGINE_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy App Engine
        run: gcloud app deploy app.yaml --project "${FIREBASE_PROJECT_ID}" --quiet

      - name: Smoke deployed application
        env:
          SMOKE_BASE_URL: https://${{ vars.FIREBASE_PROJECT_ID }}.uc.r.appspot.com
        run: npm run smoke:auth
