name: Deploy Firestore Rules

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment to deploy rules
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-rules:
    name: Deploy rules to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      DEPLOY_SERVICE: firestore-rules
      HIPAA_SYNTHETIC_TESTING_APPROVED: ${{ vars.HIPAA_SYNTHETIC_TESTING_APPROVED }}
      HIPAA_PRODUCTION_APPROVED: ${{ vars.HIPAA_PRODUCTION_APPROVED }}
      GOOGLE_CLOUD_BAA_EFFECTIVE_DATE: ${{ vars.GOOGLE_CLOUD_BAA_EFFECTIVE_DATE }}
      HIPAA_SECURITY_OFFICER: ${{ vars.HIPAA_SECURITY_OFFICER }}
      HIPAA_PRIVACY_OFFICER: ${{ vars.HIPAA_PRIVACY_OFFICER }}
      HIPAA_INCIDENT_COMMANDER: ${{ vars.HIPAA_INCIDENT_COMMANDER }}
      HIPAA_BACKUP_OPERATIONAL_OWNER: ${{ vars.HIPAA_BACKUP_OPERATIONAL_OWNER }}
      HIPAA_LEGAL_COUNSEL: ${{ vars.HIPAA_LEGAL_COUNSEL }}
      PRODUCTION_AUTH_VERIFIED: ${{ vars.PRODUCTION_AUTH_VERIFIED }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Validate rules deployment environment
        run: |
          npm run validate:rules-deploy-env
          npm run validate:hipaa-production

      - name: Test Firestore rules
        run: npm run test:rules

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules
        run: npx -y firebase-tools@15.22.3 deploy --only firestore:rules --project "${FIREBASE_PROJECT_ID}"
