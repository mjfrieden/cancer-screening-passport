name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Production smoke test
        run: |
          npm run start > /tmp/cancer-passport.log 2>&1 &
          echo $! > /tmp/cancer-passport.pid
          SMOKE_BASE_URL=http://127.0.0.1:3000 npm run smoke
          kill $(cat /tmp/cancer-passport.pid)

      - name: Beta preflight
        run: npm run preflight:beta

      - name: Capacitor asset sync
        run: npx cap sync

      - name: Native identity checks
        run: npm run native:check

      - name: Store submission QA
        env:
          STORE_QA_BASE_URL: http://127.0.0.1:3000
        run: |
          npm run start > /tmp/cancer-passport-store-qa.log 2>&1 &
          echo $! > /tmp/cancer-passport-store-qa.pid
          cleanup() {
            if [ -f /tmp/cancer-passport-store-qa.pid ]; then
              kill "$(cat /tmp/cancer-passport-store-qa.pid)" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          npm run qa:store

      - name: Upload store QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-submission-qa
          path: artifacts/store-submission-qa
          if-no-files-found: warn

      - name: Compile Android debug application
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Audit dependencies
        run: npm run audit

      - name: Firestore rules tests
        run: npm run test:rules
