name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Production smoke test
        run: |
          npm run start > /tmp/cancer-passport.log 2>&1 &
          echo $! > /tmp/cancer-passport.pid
          SMOKE_BASE_URL=http://127.0.0.1:3000 npm run smoke
          kill $(cat /tmp/cancer-passport.pid)

      - name: Audit dependencies
        run: npm run audit

      - name: Firestore rules tests
        run: npm run test:rules
