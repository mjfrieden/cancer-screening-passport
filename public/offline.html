<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <title>Offline | Cancer Prevention Passport</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #111827;
        background: #ffffff;
      }

      main {
        width: min(420px, calc(100vw - 40px));
        text-align: center;
        padding: 40px 0;
      }

      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        background: #2563eb;
        color: #ffffff;
        font-size: 34px;
        font-weight: 800;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.65rem;
        line-height: 1.15;
      }

      p {
        margin: 0;
        color: #4b5563;
        line-height: 1.55;
      }

      a {
        display: inline-block;
        margin-top: 24px;
        color: #2563eb;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">+</div>
      <h1>You are offline</h1>
      <p>Cancer Prevention Passport needs a connection for sign-in, saved records, and updated recommendations. Reconnect and try again.</p>
      <a href="/">Retry</a>
    </main>
  </body>
</html>
